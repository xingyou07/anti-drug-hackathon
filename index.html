<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steady — support without the lecture</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1f2a37; --muted: #5b6675; --line: #e6e2d8;
    --primary: #0f766e; --primary-ink: #ffffff; --soft: #d9f0ec; --warm: #f59e0b; --warm-soft: #fdf0d2;
    --bad: #b91c1c; --bad-soft: #fbe4e4; --good: #166534; --good-soft: #dcf5e4;
    --radius: 18px; --shadow: 0 2px 10px rgba(31,42,55,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1720; --card: #182230; --ink: #eaf0f6; --muted: #9db0c3; --line: #263547;
      --primary: #2dd4bf; --primary-ink: #04201c; --soft: #12332f; --warm: #fbbf24; --warm-soft: #3a2f10;
      --bad: #f87171; --bad-soft: #3b1a1a; --good: #4ade80; --good-soft: #12301d; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #shell { max-width: 640px; margin: 0 auto; min-height: 100vh; padding: 0 16px 96px; }
  header { display: flex; align-items: center; gap: 10px; padding: 18px 0 8px; }
  .logo { width: 34px; height: 34px; border-radius: 11px; background: var(--primary); color: var(--primary-ink); display: grid; place-items: center; font-weight: 800; }
  header b { font-size: 20px; letter-spacing: .2px; }
  header span { color: var(--muted); font-size: 13px; margin-left: auto; }
  h1 { font-size: 28px; line-height: 1.2; margin: 14px 0 6px; }
  h2 { font-size: 20px; margin: 18px 0 8px; }
  p { margin: 8px 0; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin: 12px 0; box-shadow: var(--shadow); }
  .card.tap { cursor: pointer; display: flex; gap: 14px; align-items: center; text-align: left; width: 100%; color: inherit; font: inherit; }
  .card.tap:hover { border-color: var(--primary); }
  .card .ic { font-size: 30px; flex: none; }
  .card h3 { margin: 0 0 2px; font-size: 18px; }
  .hero { background: linear-gradient(135deg, var(--soft), var(--warm-soft)); border: 0; }
  .btn { appearance: none; border: 0; background: var(--primary); color: var(--primary-ink); font: inherit; font-weight: 650; padding: 13px 18px; border-radius: 14px; cursor: pointer; width: 100%; margin-top: 10px; text-align: center; text-decoration: none; display: block; }
  .btn:hover { filter: brightness(1.06); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  .btn.ghost:hover { border-color: var(--primary); }
  .btn.big { padding: 22px; font-size: 20px; border-radius: 20px; }
  .btn.danger { background: var(--bad); color: #fff; }
  .btn.inline { display: inline-block; width: auto; }
  .choice { text-align: left; }
  .back { background: none; border: 0; color: var(--primary); font: inherit; font-weight: 600; cursor: pointer; padding: 6px 0; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--soft); color: var(--primary); }
  .tag.good { background: var(--good-soft); color: var(--good); }
  .tag.hard { background: var(--bad-soft); color: var(--bad); }
  .tag.okay { background: var(--warm-soft); color: var(--warm); }
  .story { font-size: 18px; line-height: 1.6; }
  .note { border-left: 4px solid var(--primary); padding: 10px 14px; background: var(--soft); border-radius: 10px; margin: 12px 0; }
  .bubble { background: var(--warm-soft); padding: 12px 14px; border-radius: 16px 16px 16px 4px; margin: 10px 0; max-width: 90%; }
  .bubble.me { background: var(--soft); margin-left: auto; border-radius: 16px 16px 4px 16px; }
  textarea, input { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 12px; margin-top: 6px; }
  textarea:focus, input:focus { outline: 2px solid var(--primary); border-color: transparent; }
  label { font-weight: 600; font-size: 14px; display: block; margin-top: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .chip { border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 99px; padding: 7px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  .chip.on { border-color: var(--primary); background: var(--soft); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--soft); border-radius: 16px; padding: 14px; text-align: center; }
  .stat b { display: block; font-size: 32px; line-height: 1.1; }
  .stat span { font-size: 13px; color: var(--muted); }
  .miles { display: flex; flex-wrap: wrap; gap: 8px; }
  .mile { padding: 8px 12px; border-radius: 12px; border: 1.5px dashed var(--line); font-size: 13px; color: var(--muted); }
  .mile.got { border: 1.5px solid var(--primary); background: var(--soft); color: var(--ink); font-weight: 650; }
  .dots { display: flex; gap: 6px; margin: 4px 0 10px; }
  .dots i { flex: 1; height: 6px; border-radius: 4px; background: var(--line); }
  .dots i.on { background: var(--primary); }
  .breath { width: 150px; height: 150px; margin: 22px auto; border-radius: 50%; background: radial-gradient(circle, var(--primary), var(--soft)); animation: breathe 10s ease-in-out infinite; opacity: .9; }
  @keyframes breathe { 0% { transform: scale(.6); } 40% { transform: scale(1.15); } 100% { transform: scale(.6); } }
  .center { text-align: center; }
  .clock { font-variant-numeric: tabular-nums; font-size: 34px; font-weight: 800; }
  .arena { position: relative; height: 220px; background: var(--bg); border: 1.5px solid var(--line); border-radius: 16px; overflow: hidden; touch-action: manipulation; }
  .dot { position: absolute; width: 54px; height: 54px; border-radius: 50%; background: var(--warm); border: 0; cursor: pointer; box-shadow: 0 0 0 6px var(--warm-soft); }
  .hot { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .hot:last-child { border: 0; }
  .hot a { color: var(--primary); font-weight: 700; text-decoration: none; white-space: nowrap; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0); }
  nav div { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
  nav button { background: none; border: 0; padding: 10px 4px 9px; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; }
  nav button span { display: block; font-size: 22px; line-height: 1.2; }
  nav button.on { color: var(--primary); font-weight: 700; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin: 24px 0 0; }
</style>
</head>
<body>
<div id="shell">
  <header><div class="logo">S</div><b>Steady</b><span>no lectures. just support.</span></header>
  <main id="app"></main>
  <footer>Educational only — not medical advice. Everything you type stays on your device.</footer>
</div>
<nav><div id="nav"></div></nav>

<script>
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('steady:' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('steady:' + k, JSON.stringify(v)); } catch {} }
};

/* ---------- content: story ---------- */
const STORY = {
  start: { text: "Saturday night. Your friend Jordan drags you to Maya's party. The music is loud and the kitchen is packed. Someone you barely know holds out a vape: “Try it — it's not even nicotine, just flavor.”",
    choices: [["Take a hit — everyone's watching", 'take1'], ["“Nah, I'm good.”", 'no1'], ['Hold it, then pass it on without using it', 'pass1']] },
  take1: { text: "You inhale. Sweet mango, then a head rush and a buzz in your chest. Most vapes contain nicotine even when the label says otherwise, and a teenage brain gets hooked fast. Twenty minutes later someone offers a small blue pill: “It's just a Percocet, chill.”",
    choices: [['Take it. You already crossed one line', 'pill_take'], ["“Wait — I'm out. Not this.”", 'pill_no'], ['Text your older sister to come get you', 'ride']] },
  pill_take: { end: 'hard', title: "A night you don't remember", text: "The pill wasn't a Percocet. Pills that don't come from a pharmacy are often counterfeit, and many contain fentanyl. You can't see it or taste it. Jordan finds you on the bathroom floor and calls 911. You wake up in a hospital with your parents beside you.",
    lesson: "Only medicine from a pharmacy, taken by the person it was prescribed for, is safe. And Jordan did exactly the right thing: when in doubt, call for help." },
  pill_no: { end: 'okay', title: 'You stopped yourself', text: "Saying no after saying yes once still counts. Nobody gets to keep score. You grab a water, find Jordan, and head out.",
    lesson: "It's never too late to change your mind mid-night." },
  ride: { end: 'good', title: 'The exit plan', text: "Your sister arrives in fifteen minutes and doesn't ask a single question until the next morning. When she does, it's just: “Proud of you for texting me.”",
    lesson: "A person you can text with no questions asked is one of the strongest protections there is. Set one up before you need it." },
  no1: { text: "“Nah, I'm good.” A couple of people shrug. One guy smirks: “Don't be lame, it's one hit.” Your face gets hot.",
    choices: [['Joke: “I\'m saving my lungs for the 400m.”', 'joke'], ['Calm and flat: “I said no.”', 'firm'], ['Say “maybe later” to end the awkwardness', 'maybe']] },
  joke: { end: 'good', title: 'Humor works', text: "The joke lands. Somebody laughs, the vape moves along, and by midnight nobody remembers.",
    lesson: "Humor is a refusal skill. It changes the mood without starting a fight." },
  firm: { end: 'good', title: 'Short and calm', text: "He holds up his hands: “Okay, okay.” Jordan slides next to you: “I didn't want to either.” You two end up on the porch splitting a pizza.",
    lesson: "A short, calm no is enough. Often someone else was hoping somebody would go first." },
  maybe: { text: "“Maybe later” is a door left open. He checks back in ten minutes, then again. Each time it's harder to say no.",
    choices: [['Give a clear no this time', 'firm'], ['Give in so he stops asking', 'take1']] },
  pass1: { text: "You fake an inhale and pass it on. Nobody notices — until the next person hands you another one and someone says, “Wait, did you actually…?”",
    choices: [['“Nope. Not my thing.”', 'firm'], ['Take a real hit to shut it down', 'take1']] }
};

/* ---------- content: refusal practice ---------- */
const SCENES = {
  vape: { label: 'Vape', icon: '💨', lines: ["Dude, just try it. It's only flavor.", "Come on, everybody's done it. Don't be boring.", "Fine, whatever. I guess you think you're better than us."] },
  pill: { label: 'Pill', icon: '💊', lines: ["Here, take this. It'll make tonight way more fun.", "It's basically a vitamin. My cousin gets them from a doctor.", "Ugh, you're no fun. One won't kill you."] },
  drink: { label: 'Drink', icon: '🥃', lines: ["Take a shot with us!", "One drink. You're being weird.", "Nobody's driving, relax. Don't make it a thing."] }
};
const SAMPLES = ["Nah, I'm good. Wanna go get food instead?", "No thanks. I'm heading out — text me later?", "Not for me. Let's play something."];

function coach(text) {
  const t = text.toLowerCase().trim();
  const words = t.split(/\s+/).filter(Boolean).length;
  const res = { stars: 0, good: [], tips: [] };
  if (!words) { res.tips.push('Type what you would actually say — even a rough version.'); return res; }
  const clearNo = /\b(no|nah|nope|not|pass|don't|dont|won't|wont|i'm good|im good|i'm out|no thanks)\b/.test(t);
  const soft = /\b(maybe|later|i guess|sorry|i'll think|might|probably|next time)\b/.test(t);
  const alt = /\b(let's|lets|instead|wanna|want to|how about|why don't|watch|play|grab|eat|pizza|food|game|leaving|heading out|gotta go|got to go)\b/.test(t);
  const rude = /\b(loser|idiot|stupid|shut up|dumb|screw)\b/.test(t);
  if (clearNo && !soft) { res.stars++; res.good.push('Clear “no” — nobody has to guess what you mean.'); }
  else if (soft) res.tips.push('“Maybe / later / sorry” leaves a door open, so expect more pressure. Try a plain “no thanks.”');
  else res.tips.push('Say the no out loud: “No thanks” or “Nah, I\'m good” works.');
  if (words <= 20) { res.stars++; res.good.push('Short and easy to say under pressure.'); }
  else res.tips.push('Long explanations sound like you\'re asking permission. One short line is stronger.');
  if (alt) { res.stars++; res.good.push('You offered something else to do or a way out — that lets everyone save face.'); }
  else res.tips.push('Add an exit: “…want to grab food instead?” or “I\'m heading out.”');
  if (rude) { res.stars = Math.max(0, res.stars - 1); res.tips.push('Skip the insults — staying cool keeps friends on your side.'); }
  return res;
}

/* ---------- content: myth or fact ---------- */
const FACTS = [
  { q: 'Vapes are just harmless water vapor.', a: false, why: 'Most contain nicotine, which is addictive and affects the developing teen brain. The aerosol also carries other chemicals.' },
  { q: 'Most teens do NOT use drugs.', a: true, why: 'It can feel like everyone is doing it, but most teens are not. Feeling outnumbered is part of the pressure.' },
  { q: 'You can tell a fake pill from a real one by looking at it.', a: false, why: 'Counterfeit pills are pressed to look identical to real ones, and many contain fentanyl. Only pharmacy-dispensed medicine is safe.' },
  { q: 'Prescription pills are safe for anyone to try.', a: false, why: 'A prescription is safe for one person at one dose under a doctor\'s watch. For anyone else it can be dangerous.' },
  { q: 'A craving lasts forever unless you give in.', a: false, why: 'Cravings tend to rise, peak, and fade — often within minutes. Riding one out gets easier with practice.' },
  { q: 'Addiction is just a lack of willpower.', a: false, why: 'Addiction changes reward and self-control circuits in the brain. It\'s a health condition, and treatment works.' },
  { q: 'If a friend won\'t wake up, calling emergency services is the right move.', a: true, why: 'Always. Fast help saves lives, and getting them help matters more than getting in trouble.' }
];

/* ---------- content: help ---------- */
const HOTLINES = [
  ['SAMHSA National Helpline', 'Free, confidential, 24/7 treatment referral', 'tel:18006624357', '1-800-662-4357'],
  ['988 Suicide & Crisis Lifeline', 'Call or text, 24/7', 'tel:988', '988'],
  ['Crisis Text Line', 'Text HOME to 741741', 'sms:741741?&body=HOME', '741741'],
  ['Poison Control', 'Took something and unsure? 24/7', 'tel:18002221222', '1-800-222-1222'],
  ['Emergency', "Someone isn't breathing or won't wake up", 'tel:911', '911']
];

/* ---------- state & routing ---------- */
const S = { tab: 'home', sub: null, story: null, practice: null, facts: null, rescue: null };
let ticker = null;
const TABS = [['home', '🏠', 'Home'], ['prevent', '🧭', 'Prevent'], ['recover', '🌱', 'Recover'], ['help', '📞', 'Help']];

function go(tab, sub = null) {
  S.tab = tab; S.sub = sub;
  if (sub === 'story') S.story = { node: 'start' };
  if (sub === 'practice') S.practice = { scene: null, round: 0, stars: 0, fb: null };
  if (sub === 'facts') S.facts = { i: 0, score: 0, ans: null };
  if (sub === 'rescue') S.rescue = { step: 0, t0: Date.now(), score: 0, done: false };
  render();
  window.scrollTo(0, 0);
}

function render() {
  clearInterval(ticker); ticker = null;
  $('#nav').innerHTML = TABS.map(([id, ic, lb]) => `<button class="${S.tab === id ? 'on' : ''}" data-go="${id}"><span>${ic}</span>${lb}</button>`).join('');
  const views = { home: vHome, prevent: vPrevent, recover: vRecover, help: vHelp };
  $('#app').innerHTML = views[S.tab]();
  if (S.tab === 'recover' && S.sub === 'rescue' && !S.rescue.done) { ticker = setInterval(tick, 250); tick(); }
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { const [tab, sub] = g.dataset.go.split(':'); return go(tab, sub || null); }
  const a = e.target.closest('[data-act]');
  if (a && ACTIONS[a.dataset.act]) ACTIONS[a.dataset.act](a.dataset.arg, a);
});

const back = (to, label = '← Back') => `<button class="back" data-go="${to}">${label}</button>`;

/* ---------- views ---------- */
function vHome() {
  const t = store.get('tracker'), days = t ? daysSince(t.start) : null;
  return `
  <div class="card hero">
    <h1>Real talk. No lectures.</h1>
    <p>Whether you're a teen trying to handle a tough moment, or someone fighting to stay clean, Steady meets you where you are.</p>
  </div>
  <button class="card tap" data-go="prevent"><div class="ic">🧭</div><div><h3>Prevent</h3><span class="muted">Play through a party, practice saying no, bust myths.</span></div></button>
  <button class="card tap" data-go="recover"><div class="ic">🌱</div><div><h3>Recover</h3><span class="muted">${days === null ? 'A craving rescue button and a streak tracker.' : `Day ${days} and counting. Craving rescue and your tracker.`}</span></div></button>
  <button class="card tap" data-go="help"><div class="ic">📞</div><div><h3>Get help now</h3><span class="muted">Free, confidential hotlines. Including “I'm not ready to quit.”</span></div></button>`;
}

function vPrevent() {
  if (S.sub === 'story') return vStory();
  if (S.sub === 'practice') return vPractice();
  if (S.sub === 'facts') return vFacts();
  return `
  <h1>Prevent</h1><p class="muted">Practice the moment before it happens.</p>
  <button class="card tap" data-go="prevent:story"><div class="ic">🎭</div><div><h3>The Party</h3><span class="muted">A choose-your-path story. Your choices have consequences.</span></div></button>
  <button class="card tap" data-go="prevent:practice"><div class="ic">💬</div><div><h3>Say No Practice</h3><span class="muted">A pushy friend. Your words. Instant coaching.</span></div></button>
  <button class="card tap" data-go="prevent:facts"><div class="ic">🧠</div><div><h3>Myth or Fact?</h3><span class="muted">Seven quick ones. Some will surprise you.</span></div></button>`;
}

function vStory() {
  const n = STORY[S.story.node];
  if (n.end) {
    return `${back('prevent', '← Menu')}
    <div class="card"><span class="tag ${n.end}">${{ good: 'Strong move', okay: 'Course-corrected', hard: 'Hard lesson' }[n.end]}</span>
      <h2>${n.title}</h2><p class="story">${n.text}</p>
      <div class="note"><b>Reality check:</b> ${n.lesson}</div>
      <button class="btn" data-act="story-restart">Play again, choose differently</button>
      <button class="btn ghost" data-go="prevent:practice">Practice saying it for real</button></div>`;
  }
  return `${back('prevent', '← Menu')}
    <div class="card"><span class="tag">The Party</span><p class="story">${n.text}</p></div>
    ${n.choices.map(([l, to]) => `<button class="btn ghost choice" data-act="story-go" data-arg="${to}">${l}</button>`).join('')}`;
}

function vPractice() {
  const p = S.practice;
  if (!p.scene) {
    return `${back('prevent', '← Menu')}<h1>Say No Practice</h1><p class="muted">Pick a situation. I'll play the pushy friend. Answer the way you'd really say it.</p>
    ${Object.entries(SCENES).map(([k, s]) => `<button class="card tap" data-act="p-scene" data-arg="${k}"><div class="ic">${s.icon}</div><div><h3>${s.label}</h3><span class="muted">${esc(s.lines[0])}</span></div></button>`).join('')}`;
  }
  const sc = SCENES[p.scene];
  if (p.round >= 3) {
    const msg = p.stars >= 8 ? "You've got this. Your refusals were clear, short, and kind of unstoppable." : p.stars >= 5 ? "Solid. Tighten up the soft spots and you're set." : "Good start. This is a skill, and it gets easier every time you rehearse.";
    return `${back('prevent', '← Menu')}<div class="card center"><h2>Round complete</h2><div class="clock">${p.stars} / 9</div><p>${msg}</p>
      <button class="btn" data-act="p-scene" data-arg="${p.scene}">Go again</button>
      <button class="btn ghost" data-go="prevent:practice">Try another situation</button></div>`;
  }
  const fb = p.fb;
  return `${back('prevent', '← Menu')}<div class="tag">${sc.label} · pressure level ${p.round + 1} of 3</div>
    <div class="bubble">🧑‍🎤 ${esc(sc.lines[p.round])}</div>
    ${fb ? `<div class="bubble me">${esc(fb.text)}</div>
      <div class="card"><b>${'★'.repeat(fb.stars)}${'☆'.repeat(3 - fb.stars)}</b>
        ${fb.good.map(g => `<p>✅ ${g}</p>`).join('')}${fb.tips.map(g => `<p>💡 ${g}</p>`).join('')}
        <button class="btn" data-act="p-next">${p.round >= 2 ? 'See results' : 'Next: they push harder'}</button></div>`
    : `<div class="card"><label for="reply">Your reply</label><textarea id="reply" rows="3" placeholder="What would you say?"></textarea>
        <button class="btn" data-act="p-send">Send</button>
        <div class="small muted" style="margin-top:10px">Need ideas?</div>
        <div class="chips">${SAMPLES.map(s => `<button class="chip" data-act="p-sample" data-arg="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>`}`;
}

function vFacts() {
  const f = S.facts;
  if (f.i >= FACTS.length) {
    return `${back('prevent', '← Menu')}<div class="card center"><h2>You got ${f.score} of ${FACTS.length}</h2><p class="muted">Whatever the score, you now know more than most people.</p>
      <button class="btn" data-go="prevent:facts">Play again</button></div>`;
  }
  const c = FACTS[f.i];
  return `${back('prevent', '← Menu')}<div class="dots">${FACTS.map((_, i) => `<i class="${i <= f.i ? 'on' : ''}"></i>`).join('')}</div>
    <div class="card"><h2 style="margin-top:0">${c.q}</h2>
    ${f.ans === null
      ? `<button class="btn ghost" data-act="f-ans" data-arg="1">Fact</button><button class="btn ghost" data-act="f-ans" data-arg="0">Myth</button>`
      : `<span class="tag ${f.ans === c.a ? 'good' : 'hard'}">${f.ans === c.a ? 'Correct' : 'Not quite'} — it's a ${c.a ? 'fact' : 'myth'}</span><p>${c.why}</p><button class="btn" data-act="f-next">Next</button>`}
    </div>`;
}

function vRecover() {
  if (S.sub === 'rescue') return vRescue();
  if (S.sub === 'tracker') return vTracker();
  const t = store.get('tracker');
  return `<h1>Recover</h1><p class="muted">Every day you're here counts.</p>
  <button class="btn big" data-go="recover:rescue">🆘 I have a craving right now</button>
  <button class="card tap" data-go="recover:tracker"><div class="ic">📈</div><div><h3>My progress</h3><span class="muted">${t ? `Day ${daysSince(t.start)} · $${Math.round(daysSince(t.start) * t.perDay)} saved` : 'Set up your streak, money saved and support plan.'}</span></div></button>
  <button class="card tap" data-go="help"><div class="ic">🤝</div><div><h3>Talk to a real person</h3><span class="muted">Free and confidential, any time.</span></div></button>`;
}

const RESCUE_STEPS = ['Breathe', 'Ground yourself', 'Keep your hands busy', 'Remember your why', 'Reach out'];
function vRescue() {
  const r = S.rescue, plan = store.get('plan', {});
  if (r.done) {
    const n = store.get('rescues', 0);
    return `<div class="card center"><div style="font-size:48px">🌊</div><h2>You rode it out.</h2>
      <p>That craving rose, peaked, and passed — and you didn't have to fight it alone. That's ${n} rode out so far.</p>
      <button class="btn" data-go="recover">Done</button></div>`;
  }
  const body = [
    `<p>In for 4, out for 6. Follow the circle. Cravings crest and fade — you only have to outlast the wave.</p><div class="breath"></div><div class="center"><b id="breath">Breathe in</b></div>`,
    `<p>Name out loud, or in your head:</p><div class="note">5 things you can <b>see</b><br>4 things you can <b>touch</b><br>3 things you can <b>hear</b><br>2 things you can <b>smell</b><br>1 thing you can <b>taste</b></div>`,
    `<p>Tap the glowing dot as many times as you can. Your brain can't fully chase a craving and a game at once.</p><div class="arena" id="arena"><button class="dot" style="left:40%;top:40%" data-act="dot" aria-label="Tap"></button></div><p class="center"><b id="score">${r.score}</b> <span class="muted">taps</span></p>`,
    plan.why ? `<p>You wrote this for yourself:</p><div class="note" style="font-size:19px">“${esc(plan.why)}”</div>` : `<p>You haven't written your “why” yet. Take a second to think: who or what are you doing this for?</p><button class="btn ghost" data-go="recover:tracker">Write it in My progress</button>`,
    plan.phone ? `<p>Send ${esc(plan.name || 'your person')} a message. You don't need to explain.</p><a class="btn" href="sms:${esc(plan.phone)}?&body=${encodeURIComponent("Hey, I'm having a rough moment. Can you talk?")}">💬 Text ${esc(plan.name || 'them')}</a><a class="btn ghost" href="tel:${esc(plan.phone)}">📞 Call</a>` : `<p>Nobody saved yet. You can still reach a real person right now.</p><button class="btn" data-go="help">Open hotlines</button><button class="btn ghost" data-go="recover:tracker">Save a trusted contact</button>`
  ][r.step];
  return `${back('recover', '← Leave')}<div class="center"><div class="clock" id="clock">10:00</div><div class="small muted">Urges tend to fade within minutes. You only have to get through this one.</div></div>
    <div class="dots" style="margin-top:14px">${RESCUE_STEPS.map((_, i) => `<i class="${i <= r.step ? 'on' : ''}"></i>`).join('')}</div>
    <div class="card"><span class="tag">Step ${r.step + 1} of 5</span><h2 style="margin-top:8px">${RESCUE_STEPS[r.step]}</h2>${body}
    <button class="btn ${r.step === 4 ? '' : 'ghost'}" data-act="r-next">${r.step === 4 ? "I'm through it" : 'Next step →'}</button></div>`;
}

const MILES = [[1, '1 day'], [3, '3 days'], [7, '1 week'], [14, '2 weeks'], [30, '1 month'], [60, '2 months'], [90, '3 months'], [180, '6 months'], [365, '1 year']];
const BUYS = [[1000, 'a real vacation ✈️'], [400, 'a new phone 📱'], [150, 'a weekend trip 🏕️'], [60, 'new sneakers 👟'], [30, 'a concert ticket 🎟️'], [10, 'a nice lunch 🍜'], [0, 'a good coffee ☕']];
const daysSince = iso => Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 864e5));

function vTracker() {
  const t = store.get('tracker'), plan = store.get('plan', {});
  const today = new Date().toISOString().slice(0, 10);
  const planCard = `<div class="card"><h2 style="margin-top:0">My support plan</h2><p class="muted small">Used by the craving rescue button. Stored only on this device.</p>
    <label for="why">Why I'm doing this</label><textarea id="why" rows="2" placeholder="e.g. So I can play in the final this year">${esc(plan.why)}</textarea>
    <label for="cname">Trusted person</label><input id="cname" placeholder="Name" value="${esc(plan.name)}">
    <label for="cphone">Their phone number</label><input id="cphone" type="tel" placeholder="Phone" value="${esc(plan.phone)}">
    <button class="btn" data-act="save-plan">Save plan</button></div>`;
  if (!t) {
    return `${back('recover', '← Back')}<h1>Start your streak</h1><div class="card">
      <label for="thing">What are you quitting? (optional)</label><input id="thing" placeholder="e.g. vaping">
      <label for="perday">About how much did it cost per day? ($)</label><input id="perday" type="number" min="0" step="0.5" value="8">
      <label for="start">Quit date</label><input id="start" type="date" max="${today}" value="${today}">
      <button class="btn" data-act="save-tracker">Start tracking</button></div>${planCard}
      <div class="note small">Quitting some substances (alcohol, benzodiazepines) suddenly can be medically dangerous. If you've used heavily, talk to a doctor before stopping.</div>`;
  }
  const d = daysSince(t.start), money = Math.round(d * t.perDay), buy = BUYS.find(([min]) => money >= min)[1];
  const next = MILES.find(([n]) => n > d);
  return `${back('recover', '← Back')}<h1>${d === 0 ? 'Day one. You showed up.' : `${d} day${d === 1 ? '' : 's'}${t.thing ? ` without ${esc(t.thing)}` : ''}`}</h1>
    <div class="stats"><div class="stat"><b>${d}</b><span>days</span></div><div class="stat"><b>$${money}</b><span>not spent</span></div>
      <div class="stat"><b>${store.get('rescues', 0)}</b><span>cravings rode out</span></div><div class="stat"><b>${Math.max(t.best || 0, d)}</b><span>best streak (days)</span></div></div>
    <div class="card"><b>That's about ${buy}.</b><p class="muted small">${next ? `Next milestone: ${next[1]}, ${next[0] - d} day${next[0] - d === 1 ? '' : 's'} to go.` : "You've passed every milestone here. Incredible."}</p>
      <div class="miles">${MILES.map(([n, l]) => `<div class="mile ${d >= n ? 'got' : ''}">${d >= n ? '✓ ' : ''}${l}</div>`).join('')}</div></div>
    ${planCard}
    <div class="card"><b>Had a slip?</b><p class="muted">It happens to many people in recovery, and it doesn't erase your progress. Your best streak is kept.</p>
      <button class="btn ghost" data-act="slip">Start a fresh streak</button></div>`;
}

function vHelp() {
  return `<h1>Get help now</h1><p class="muted">Free, confidential, and no judgment. (Numbers shown are for the US; swap in your local ones.)</p>
  <div class="card">${HOTLINES.map(([n, d, href, label]) => `<div class="hot"><div><b>${n}</b><br><span class="muted small">${d}</span></div><a href="${href}">${label}</a></div>`).join('')}</div>
  <div class="card"><h2 style="margin-top:0">I'm not ready to quit — I just want to talk</h2>
    <p>That's okay. You don't have to be ready to call. The SAMHSA helpline will talk through options with no pressure.</p>
    <div class="note"><b>Safer-use basics, if you're using right now:</b><br>• Don't use alone. Tell someone or use with a person who can call for help.<br>• Assume any pill not from a pharmacy could contain fentanyl.<br>• If you use opioids, carry naloxone (Narcan). Many pharmacies offer it without a prescription.<br>• Don't mix substances, especially with alcohol or sedatives.</div>
    <a class="btn" href="tel:18006624357">Call SAMHSA: 1-800-662-4357</a></div>
  <div class="card"><h2 style="margin-top:0">Worried about someone else?</h2><p>Stay calm, pick a private moment, and lead with care: “I've noticed you seem off lately, and I care about you.” Ask questions before giving advice, and offer to help them find support.</p></div>`;
}

/* ---------- live updates (no re-render, so games keep state) ---------- */
function tick() {
  const r = S.rescue; if (!r) return;
  const el = Math.floor((Date.now() - r.t0) / 1000), rem = Math.max(0, 600 - el);
  const c = $('#clock'); if (c) c.textContent = `${String(Math.floor(rem / 60)).padStart(2, '0')}:${String(rem % 60).padStart(2, '0')}`;
  const b = $('#breath'); if (b) b.textContent = (el % 10) < 4 ? 'Breathe in…' : 'Breathe out slowly…';
}

/* ---------- actions ---------- */
const ACTIONS = {
  'story-go': to => { S.story.node = to; render(); window.scrollTo(0, 0); },
  'story-restart': () => go('prevent', 'story'),
  'p-scene': k => { S.practice = { scene: k, round: 0, stars: 0, fb: null }; render(); },
  'p-sample': s => { $('#reply').value = s; $('#reply').focus(); },
  'p-send': () => { const text = $('#reply').value; const res = coach(text); if (!text.trim()) return $('#reply').focus(); S.practice.fb = { ...res, text }; S.practice.stars += res.stars; render(); },
  'p-next': () => { S.practice.round++; S.practice.fb = null; render(); },
  'f-ans': v => { const f = S.facts; f.ans = v === '1'; if (f.ans === FACTS[f.i].a) f.score++; render(); },
  'f-next': () => { S.facts.i++; S.facts.ans = null; render(); },
  'r-next': () => {
    const r = S.rescue;
    if (r.step < 4) { r.step++; return render(); }
    store.set('rescues', store.get('rescues', 0) + 1); r.done = true; render();
  },
  'dot': (_, el) => {
    S.rescue.score++; $('#score').textContent = S.rescue.score;
    el.style.left = (Math.random() * 78 + 2) + '%'; el.style.top = (Math.random() * 70 + 2) + '%';
  },
  'save-tracker': () => {
    store.set('tracker', { thing: $('#thing').value.trim(), perDay: Math.max(0, parseFloat($('#perday').value) || 0), start: ($('#start').value || new Date().toISOString().slice(0, 10)) + 'T00:00:00', best: 0 });
    savePlan(); render();
  },
  'save-plan': (_, el) => { savePlan(); el.textContent = 'Saved ✓'; },
  'slip': () => {
    if (!confirm('Start a fresh streak? Your best streak will be kept.')) return;
    const t = store.get('tracker'); t.best = Math.max(t.best || 0, daysSince(t.start)); t.start = new Date().toISOString(); store.set('tracker', t); render();
  }
};
function savePlan() {
  const g = id => ($(id) ? $(id).value.trim() : '');
  store.set('plan', { why: g('#why'), name: g('#cname'), phone: g('#cphone') });
}

render();
</script>
</body>
</html>
