<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steady — support without the lecture</title>

<!-- Tailwind (play CDN) + Motion (vanilla sibling of Framer Motion). Both load from CDNs, so the first open needs internet. -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@11.18.2/dist/motion.js"></script>
<script>
  // shadcn-style design tokens, mapped to CSS variables so light/dark switch automatically.
  tailwind.config = {
    theme: { extend: {
      colors: {
        background: 'var(--background)', foreground: 'var(--foreground)', card: 'var(--card)',
        border: 'var(--border)', ring: 'var(--ring)',
        muted: { DEFAULT: 'var(--muted)', foreground: 'var(--muted-foreground)' },
        primary: { DEFAULT: 'var(--primary)', foreground: 'var(--primary-foreground)' },
        secondary: 'var(--secondary)',
        destructive: { DEFAULT: 'var(--destructive)', soft: 'var(--destructive-soft)' },
        success: { DEFAULT: 'var(--success)', soft: 'var(--success-soft)' },
        warning: { DEFAULT: 'var(--warning)', soft: 'var(--warning-soft)', ink: 'var(--warning-ink)' }
      },
      keyframes: { breathe: { '0%': { transform: 'scale(.6)' }, '40%': { transform: 'scale(1.15)' }, '100%': { transform: 'scale(.6)' } } },
      animation: { breathe: 'breathe 10s ease-in-out infinite' }
    } }
  };
</script>
<style>
  :root {
    --background: #f6f4ef; --foreground: #1f2a37; --card: #ffffff; --border: #e6e2d8; --ring: #0f766e;
    --muted: #efece4; --muted-foreground: #5b6675;
    --primary: #0f766e; --primary-foreground: #ffffff; --secondary: #d9f0ec;
    --destructive: #b91c1c; --destructive-soft: #fbe4e4;
    --success: #166534; --success-soft: #dcf5e4;
    --warning: #f59e0b; --warning-soft: #fdf0d2; --warning-ink: #92400e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #0f1720; --foreground: #eaf0f6; --card: #182230; --border: #263547; --ring: #2dd4bf;
      --muted: #1d2b3b; --muted-foreground: #9db0c3;
      --primary: #2dd4bf; --primary-foreground: #04201c; --secondary: #12332f;
      --destructive: #f87171; --destructive-soft: #3b1a1a;
      --success: #4ade80; --success-soft: #12301d;
      --warning: #fbbf24; --warning-soft: #3a2f10; --warning-ink: #fbbf24;
    }
  }
  /* paints correctly even before the Tailwind script finishes loading */
  body { margin: 0; background: var(--background); color: var(--foreground); }
  /* Tailwind's preflight zeroes paragraph margins */
  #app p { margin: .5rem 0; }
</style>
</head>
<body class="bg-background font-sans text-base leading-normal text-foreground antialiased">
<div id="shell" class="mx-auto min-h-screen max-w-xl px-4 pb-28">
  <header class="flex items-center gap-2.5 pb-2 pt-5">
    <div class="grid size-9 place-items-center rounded-xl bg-primary font-extrabold text-primary-foreground">S</div>
    <b class="text-xl tracking-wide">Steady</b>
    <span class="ml-auto text-xs text-muted-foreground">no lectures. just support.</span>
  </header>
  <main id="app"></main>
  <footer class="mt-6 text-center text-xs text-muted-foreground">Educational only — not medical advice. Everything you type stays on your device.</footer>
</div>
<nav class="fixed inset-x-0 bottom-0 border-t border-border bg-card pb-[env(safe-area-inset-bottom)]">
  <div id="nav" class="mx-auto grid max-w-xl grid-cols-4"></div>
</nav>

<script>
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cn = (...c) => c.filter(Boolean).join(' ');
const store = {
  get(k, d) { try { const v = localStorage.getItem('steady:' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('steady:' + k, JSON.stringify(v)); } catch {} }
};

/* ---------- UI kit (shadcn-style components as plain functions) ---------- */
const attrs = o => [o.go && `data-go="${o.go}"`, o.act && `data-act="${o.act}"`, o.arg !== undefined && `data-arg="${esc(o.arg)}"`, o.href && `href="${o.href}"`, o.id && `id="${o.id}"`, o.aria && `aria-label="${o.aria}"`, o.style && `style="${o.style}"`].filter(Boolean).join(' ');

const BTN_BASE = 'mt-2.5 inline-flex w-full items-center gap-2 rounded-xl px-5 py-3 text-base font-semibold no-underline transition active:scale-[.97] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background';
const BTN_VARIANT = {
  default: 'bg-primary text-primary-foreground hover:brightness-110',
  outline: 'border-2 border-border bg-transparent text-foreground hover:border-primary',
  ghost: 'bg-transparent text-primary hover:bg-secondary',
  destructive: 'bg-destructive text-white hover:brightness-110'
};
const BTN_SIZE = { md: '', lg: 'rounded-3xl py-6 text-xl' };
function Button(label, o = {}) {
  const tag = o.href ? 'a' : 'button';
  return `<${tag} class="${cn(BTN_BASE, BTN_VARIANT[o.variant || 'default'], BTN_SIZE[o.size || 'md'], o.align === 'start' ? 'justify-start text-left' : 'justify-center', o.cls)}" ${attrs(o)}>${label}</${tag}>`;
}
const BackLink = (to, label = '← Back') => `<button class="-ml-1 inline-flex px-1 py-1.5 font-semibold text-primary" data-go="${to}">${label}</button>`;

const Card = (inner, o = {}) => `<div class="${cn('my-3 rounded-2xl border border-border bg-card p-5 text-card-foreground shadow-sm', o.cls)}" ${o.fx ? 'data-fx' : ''}>${inner}</div>`;
const TapCard = (icon, title, sub, o) => `<button class="my-3 flex w-full items-center gap-3.5 rounded-2xl border border-border bg-card p-5 text-left shadow-sm transition hover:border-primary active:scale-[.99]" ${attrs(o)}>
  <div class="flex-none text-3xl">${icon}</div><div><h3 class="text-lg font-bold leading-snug">${title}</h3><span class="text-muted-foreground">${sub}</span></div></button>`;

const BADGE = { default: 'bg-secondary text-primary', good: 'bg-success-soft text-success', hard: 'bg-destructive-soft text-destructive', okay: 'bg-warning-soft text-warning-ink' };
const Badge = (text, v = 'default') => `<span class="inline-block rounded-full px-2.5 py-0.5 text-xs font-bold ${BADGE[v]}">${text}</span>`;
const Note = (html, cls = '') => `<div class="${cn('my-3 rounded-xl border-l-4 border-primary bg-secondary px-3.5 py-2.5', cls)}">${html}</div>`;
const Steps = (total, active) => `<div class="my-1 mb-3 flex gap-1.5">${Array.from({ length: total }, (_, i) => `<i class="h-1.5 flex-1 rounded transition-colors ${i <= active ? 'bg-primary' : 'bg-border'}"></i>`).join('')}</div>`;
const H1 = t => `<h1 class="mb-1.5 mt-3.5 text-3xl font-extrabold leading-tight">${t}</h1>`;
const H2 = (t, cls = '') => `<h2 class="${cn('mb-2 mt-1 text-xl font-bold', cls)}">${t}</h2>`;
const Muted = (t, cls = '') => `<p class="${cn('text-muted-foreground', cls)}">${t}</p>`;
const FIELD = 'mt-1.5 w-full rounded-xl border-2 border-border bg-background px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-ring';
const Label = (id, t) => `<label for="${id}" class="mt-3 block text-sm font-semibold">${t}</label>`;
const Input = (id, label, o = '') => `${Label(id, label)}<input id="${id}" class="${FIELD}" ${o}>`;
const Textarea = (id, label, value, o = '') => `${Label(id, label)}<textarea id="${id}" class="${FIELD}" ${o}>${value}</textarea>`;

/* ---------- motion (no-ops if the CDN fails or the user prefers reduced motion) ---------- */
const M = window.Motion;
const REDUCE = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function run(fn) { if (M && !REDUCE) { try { fn(M); } catch {} } }

function enter(full) {
  run(m => {
    const targets = full ? '#app > *' : '#app [data-fx]';
    if ($(targets)) m.animate(targets, { opacity: [0, 1], y: [full ? 14 : 8, 0] }, { duration: full ? .4 : .3, delay: m.stagger(full ? .06 : .05), ease: 'easeOut' });
    if ($('[data-star]')) m.animate('[data-star]', { scale: [.2, 1.3, 1] }, { duration: .4, delay: m.stagger(.12) });
    if ($('.mile-got')) m.animate('.mile-got', { scale: [.85, 1] }, { duration: .3, delay: m.stagger(.05) });
    if ($('#wave')) m.animate('#wave', { y: [0, -14, 0] }, { duration: .6, repeat: 2 });
    document.querySelectorAll('[data-count]').forEach(el => {
      const n = +el.dataset.count, p = el.dataset.prefix || '';
      m.animate(0, n, { duration: .9, ease: 'easeOut', onUpdate: v => { el.textContent = p + Math.round(v); } });
    });
  });
}

/* ---------- content: story ---------- */
const STORY = {
  start: { text: "Saturday night. Your friend Jordan drags you to Maya's party. The music is loud and the kitchen is packed. Someone you barely know holds out a vape: “Try it — it's not even nicotine, just flavor.”",
    choices: [["Take a hit — everyone's watching", 'take1'], ["“Nah, I'm good.”", 'no1'], ['Hold it, then pass it on without using it', 'pass1']] },
  take1: { text: "You inhale. Sweet mango, then a head rush and a buzz in your chest. Most vapes contain nicotine even when the label says otherwise, and a teenage brain gets hooked fast. Twenty minutes later someone offers a small blue pill: “It's just a Percocet, chill.”",
    choices: [['Take it. You already crossed one line', 'pill_take'], ["“Wait — I'm out. Not this.”", 'pill_no'], ['Text your older sister to come get you', 'ride']] },
  pill_take: { end: 'hard', title: "A night you don't remember", text: "The pill wasn't a Percocet. Pills that don't come from a pharmacy are often counterfeit, and many contain fentanyl. You can't see it or taste it. Jordan finds you on the bathroom floor and calls 911. You wake up in a hospital with your parents beside you.",
    lesson: "Only medicine from a pharmacy, taken by the person it was prescribed for, is safe. And Jordan did exactly the right thing: when in doubt, call for help." },
  pill_no: { end: 'okay', title: 'You stopped yourself', text: "Saying no after saying yes once still counts. Nobody gets to keep score. You grab a water, find Jordan, and head out.",
    lesson: "It's never too late to change your mind mid-night." },
  ride: { end: 'good', title: 'The exit plan', text: "Your sister arrives in fifteen minutes and doesn't ask a single question until the next morning. When she does, it's just: “Proud of you for texting me.”",
    lesson: "A person you can text with no questions asked is one of the strongest protections there is. Set one up before you need it." },
  no1: { text: "“Nah, I'm good.” A couple of people shrug. One guy smirks: “Don't be lame, it's one hit.” Your face gets hot.",
    choices: [['Joke: “I\'m saving my lungs for the 400m.”', 'joke'], ['Calm and flat: “I said no.”', 'firm'], ['Say “maybe later” to end the awkwardness', 'maybe']] },
  joke: { end: 'good', title: 'Humor works', text: "The joke lands. Somebody laughs, the vape moves along, and by midnight nobody remembers.",
    lesson: "Humor is a refusal skill. It changes the mood without starting a fight." },
  firm: { end: 'good', title: 'Short and calm', text: "He holds up his hands: “Okay, okay.” Jordan slides next to you: “I didn't want to either.” You two end up on the porch splitting a pizza.",
    lesson: "A short, calm no is enough. Often someone else was hoping somebody would go first." },
  maybe: { text: "“Maybe later” is a door left open. He checks back in ten minutes, then again. Each time it's harder to say no.",
    choices: [['Give a clear no this time', 'firm'], ['Give in so he stops asking', 'take1']] },
  pass1: { text: "You fake an inhale and pass it on. Nobody notices — until the next person hands you another one and someone says, “Wait, did you actually…?”",
    choices: [['“Nope. Not my thing.”', 'firm'], ['Take a real hit to shut it down', 'take1']] }
};

/* ---------- content: refusal practice ---------- */
const SCENES = {
  vape: { label: 'Vape', icon: '💨', lines: ["Dude, just try it. It's only flavor.", "Come on, everybody's done it. Don't be boring.", "Fine, whatever. I guess you think you're better than us."] },
  pill: { label: 'Pill', icon: '💊', lines: ["Here, take this. It'll make tonight way more fun.", "It's basically a vitamin. My cousin gets them from a doctor.", "Ugh, you're no fun. One won't kill you."] },
  drink: { label: 'Drink', icon: '🥃', lines: ["Take a shot with us!", "One drink. You're being weird.", "Nobody's driving, relax. Don't make it a thing."] }
};
const SAMPLES = ["Nah, I'm good. Wanna go get food instead?", "No thanks. I'm heading out — text me later?", "Not for me. Let's play something."];

function coach(text) {
  const t = text.toLowerCase().trim();
  const words = t.split(/\s+/).filter(Boolean).length;
  const res = { stars: 0, good: [], tips: [] };
  if (!words) { res.tips.push('Type what you would actually say — even a rough version.'); return res; }
  const clearNo = /\b(no|nah|nope|not|pass|don't|dont|won't|wont|i'm good|im good|i'm out|no thanks)\b/.test(t);
  const soft = /\b(maybe|later|i guess|sorry|i'll think|might|probably|next time)\b/.test(t);
  const alt = /\b(let's|lets|instead|wanna|want to|how about|why don't|watch|play|grab|eat|pizza|food|game|leaving|heading out|gotta go|got to go)\b/.test(t);
  const rude = /\b(loser|idiot|stupid|shut up|dumb|screw)\b/.test(t);
  if (clearNo && !soft) { res.stars++; res.good.push('Clear “no” — nobody has to guess what you mean.'); }
  else if (soft) res.tips.push('“Maybe / later / sorry” leaves a door open, so expect more pressure. Try a plain “no thanks.”');
  else res.tips.push('Say the no out loud: “No thanks” or “Nah, I\'m good” works.');
  if (words <= 20) { res.stars++; res.good.push('Short and easy to say under pressure.'); }
  else res.tips.push('Long explanations sound like you\'re asking permission. One short line is stronger.');
  if (alt) { res.stars++; res.good.push('You offered something else to do or a way out — that lets everyone save face.'); }
  else res.tips.push('Add an exit: “…want to grab food instead?” or “I\'m heading out.”');
  if (rude) { res.stars = Math.max(0, res.stars - 1); res.tips.push('Skip the insults — staying cool keeps friends on your side.'); }
  return res;
}

/* ---------- content: myth or fact ---------- */
const FACTS = [
  { q: 'Vapes are just harmless water vapor.', a: false, why: 'Most contain nicotine, which is addictive and affects the developing teen brain. The aerosol also carries other chemicals.' },
  { q: 'Most teens do NOT use drugs.', a: true, why: 'It can feel like everyone is doing it, but most teens are not. Feeling outnumbered is part of the pressure.' },
  { q: 'You can tell a fake pill from a real one by looking at it.', a: false, why: 'Counterfeit pills are pressed to look identical to real ones, and many contain fentanyl. Only pharmacy-dispensed medicine is safe.' },
  { q: 'Prescription pills are safe for anyone to try.', a: false, why: 'A prescription is safe for one person at one dose under a doctor\'s watch. For anyone else it can be dangerous.' },
  { q: 'A craving lasts forever unless you give in.', a: false, why: 'Cravings tend to rise, peak, and fade — often within minutes. Riding one out gets easier with practice.' },
  { q: 'Addiction is just a lack of willpower.', a: false, why: 'Addiction changes reward and self-control circuits in the brain. It\'s a health condition, and treatment works.' },
  { q: 'If a friend won\'t wake up, calling emergency services is the right move.', a: true, why: 'Always. Fast help saves lives, and getting them help matters more than getting in trouble.' }
];

/* ---------- content: help ---------- */
const HOTLINES = [
  ['SAMHSA National Helpline', 'Free, confidential, 24/7 treatment referral', 'tel:18006624357', '1-800-662-4357'],
  ['988 Suicide & Crisis Lifeline', 'Call or text, 24/7', 'tel:988', '988'],
  ['Crisis Text Line', 'Text HOME to 741741', 'sms:741741?&body=HOME', '741741'],
  ['Poison Control', 'Took something and unsure? 24/7', 'tel:18002221222', '1-800-222-1222'],
  ['Emergency', "Someone isn't breathing or won't wake up", 'tel:911', '911']
];

/* ---------- state & routing ---------- */
const S = { tab: 'home', sub: null, story: null, practice: null, facts: null, rescue: null };
let ticker = null;
const TABS = [['home', '🏠', 'Home'], ['prevent', '🧭', 'Prevent'], ['recover', '🌱', 'Recover'], ['help', '📞', 'Help']];

function go(tab, sub = null) {
  S.tab = tab; S.sub = sub;
  if (sub === 'story') S.story = { node: 'start' };
  if (sub === 'practice') S.practice = { scene: null, round: 0, stars: 0, fb: null };
  if (sub === 'facts') S.facts = { i: 0, score: 0, ans: null };
  if (sub === 'rescue') S.rescue = { step: 0, t0: Date.now(), score: 0, done: false };
  render(true);
  window.scrollTo(0, 0);
}

// full = a screen change (animate everything); otherwise only [data-fx] parts animate
function render(full = false) {
  clearInterval(ticker); ticker = null;
  $('#nav').innerHTML = TABS.map(([id, ic, lb]) => `<button class="px-1 pb-2 pt-2.5 text-xs ${S.tab === id ? 'font-bold text-primary' : 'text-muted-foreground'}" data-go="${id}"><span class="block text-2xl leading-tight">${ic}</span>${lb}</button>`).join('');
  const views = { home: vHome, prevent: vPrevent, recover: vRecover, help: vHelp };
  $('#app').innerHTML = views[S.tab]();
  if (S.tab === 'recover' && S.sub === 'rescue' && !S.rescue.done) { ticker = setInterval(tick, 250); tick(); }
  enter(full);
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { const [tab, sub] = g.dataset.go.split(':'); return go(tab, sub || null); }
  const a = e.target.closest('[data-act]');
  if (a && ACTIONS[a.dataset.act]) ACTIONS[a.dataset.act](a.dataset.arg, a);
});

/* ---------- views ---------- */
function vHome() {
  const t = store.get('tracker'), days = t ? daysSince(t.start) : null;
  return `
  <div class="my-3 rounded-2xl bg-gradient-to-br from-secondary to-warning-soft p-5">
    <h1 class="mb-1.5 text-3xl font-extrabold leading-tight">Real talk. No lectures.</h1>
    <p>Whether you're a teen trying to handle a tough moment, or someone fighting to stay clean, Steady meets you where you are.</p>
  </div>
  ${TapCard('🧭', 'Prevent', 'Play through a party, practice saying no, bust myths.', { go: 'prevent' })}
  ${TapCard('🌱', 'Recover', days === null ? 'A craving rescue button and a streak tracker.' : `Day ${days} and counting. Craving rescue and your tracker.`, { go: 'recover' })}
  ${TapCard('📞', 'Get help now', 'Free, confidential hotlines. Including “I\'m not ready to quit.”', { go: 'help' })}`;
}

function vPrevent() {
  if (S.sub === 'story') return vStory();
  if (S.sub === 'practice') return vPractice();
  if (S.sub === 'facts') return vFacts();
  return `${H1('Prevent')}${Muted('Practice the moment before it happens.')}
  ${TapCard('🎭', 'The Party', 'A choose-your-path story. Your choices have consequences.', { go: 'prevent:story' })}
  ${TapCard('💬', 'Say No Practice', 'A pushy friend. Your words. Instant coaching.', { go: 'prevent:practice' })}
  ${TapCard('🧠', 'Myth or Fact?', 'Seven quick ones. Some will surprise you.', { go: 'prevent:facts' })}`;
}

function vStory() {
  const n = STORY[S.story.node];
  if (n.end) {
    return `${BackLink('prevent', '← Menu')}
    ${Card(`${Badge({ good: 'Strong move', okay: 'Course-corrected', hard: 'Hard lesson' }[n.end], n.end)}
      ${H2(n.title, 'mt-2')}<p class="text-lg leading-relaxed">${n.text}</p>
      ${Note(`<b>Reality check:</b> ${n.lesson}`)}
      ${Button('Play again, choose differently', { act: 'story-restart' })}
      ${Button('Practice saying it for real', { go: 'prevent:practice', variant: 'outline' })}`, { fx: true })}`;
  }
  return `${BackLink('prevent', '← Menu')}
    ${Card(`${Badge('The Party')}<p class="text-lg leading-relaxed">${n.text}</p>`, { fx: true })}
    <div data-fx>${n.choices.map(([l, to]) => Button(l, { act: 'story-go', arg: to, variant: 'outline', align: 'start' })).join('')}</div>`;
}

function vPractice() {
  const p = S.practice;
  if (!p.scene) {
    return `${BackLink('prevent', '← Menu')}${H1('Say No Practice')}${Muted("Pick a situation. I'll play the pushy friend. Answer the way you'd really say it.")}
    ${Object.entries(SCENES).map(([k, s]) => TapCard(s.icon, s.label, esc(s.lines[0]), { act: 'p-scene', arg: k })).join('')}`;
  }
  const sc = SCENES[p.scene];
  if (p.round >= 3) {
    const msg = p.stars >= 8 ? "You've got this. Your refusals were clear, short, and kind of unstoppable." : p.stars >= 5 ? "Solid. Tighten up the soft spots and you're set." : "Good start. This is a skill, and it gets easier every time you rehearse.";
    return `${BackLink('prevent', '← Menu')}${Card(`${H2('Round complete')}<div class="text-4xl font-extrabold tabular-nums">${p.stars} / 9</div><p>${msg}</p>
      ${Button('Go again', { act: 'p-scene', arg: p.scene })}${Button('Try another situation', { go: 'prevent:practice', variant: 'outline' })}`, { cls: 'text-center', fx: true })}`;
  }
  const fb = p.fb, bubble = 'my-2.5 max-w-[90%] rounded-2xl px-3.5 py-3';
  const stars = fb ? Array.from({ length: 3 }, (_, i) => i < fb.stars ? '<span data-star class="inline-block text-2xl text-warning">★</span>' : '<span class="inline-block text-2xl text-border">★</span>').join('') : '';
  return `${BackLink('prevent', '← Menu')}<div>${Badge(`${sc.label} · pressure level ${p.round + 1} of 3`)}</div>
    <div class="${bubble} rounded-bl-sm bg-warning-soft" data-fx>🧑‍🎤 ${esc(sc.lines[p.round])}</div>
    ${fb ? `<div class="${bubble} ml-auto rounded-br-sm bg-secondary" data-fx>${esc(fb.text)}</div>
      ${Card(`<div>${stars}</div>
        ${fb.good.map(g => `<p>✅ ${g}</p>`).join('')}${fb.tips.map(g => `<p>💡 ${g}</p>`).join('')}
        ${Button(p.round >= 2 ? 'See results' : 'Next: they push harder', { act: 'p-next' })}`, { fx: true })}`
    : Card(`${Textarea('reply', 'Your reply', '', 'rows="3" placeholder="What would you say?"')}
        ${Button('Send', { act: 'p-send' })}
        <div class="mt-2.5 text-sm text-muted-foreground">Need ideas?</div>
        <div class="my-2 flex flex-wrap gap-2">${SAMPLES.map(s => `<button class="rounded-full border-2 border-border bg-card px-3.5 py-1.5 text-left text-sm transition hover:border-primary active:scale-[.97]" data-act="p-sample" data-arg="${esc(s)}">${esc(s)}</button>`).join('')}</div>`, { fx: true })}`;
}

function vFacts() {
  const f = S.facts;
  if (f.i >= FACTS.length) {
    return `${BackLink('prevent', '← Menu')}${Card(`${H2(`You got ${f.score} of ${FACTS.length}`)}${Muted('Whatever the score, you now know more than most people.')}
      ${Button('Play again', { go: 'prevent:facts' })}`, { cls: 'text-center', fx: true })}`;
  }
  const c = FACTS[f.i];
  return `${BackLink('prevent', '← Menu')}${Steps(FACTS.length, f.i)}
    ${Card(`${H2(c.q, 'mt-0')}
    ${f.ans === null
      ? Button('Fact', { act: 'f-ans', arg: '1', variant: 'outline' }) + Button('Myth', { act: 'f-ans', arg: '0', variant: 'outline' })
      : `${Badge(`${f.ans === c.a ? 'Correct' : 'Not quite'} — it's a ${c.a ? 'fact' : 'myth'}`, f.ans === c.a ? 'good' : 'hard')}<p>${c.why}</p>${Button('Next', { act: 'f-next' })}`}`, { fx: true })}`;
}

function vRecover() {
  if (S.sub === 'rescue') return vRescue();
  if (S.sub === 'tracker') return vTracker();
  const t = store.get('tracker');
  return `${H1('Recover')}${Muted("Every day you're here counts.")}
  ${Button('🆘 I have a craving right now', { go: 'recover:rescue', size: 'lg', cls: 'my-3' })}
  ${TapCard('📈', 'My progress', t ? `Day ${daysSince(t.start)} · $${Math.round(daysSince(t.start) * t.perDay)} saved` : 'Set up your streak, money saved and support plan.', { go: 'recover:tracker' })}
  ${TapCard('🤝', 'Talk to a real person', 'Free and confidential, any time.', { go: 'help' })}`;
}

const RESCUE_STEPS = ['Breathe', 'Ground yourself', 'Keep your hands busy', 'Remember your why', 'Reach out'];
function vRescue() {
  const r = S.rescue, plan = store.get('plan', {});
  if (r.done) {
    const n = store.get('rescues', 0);
    return Card(`<div id="wave" class="text-5xl">🌊</div>${H2('You rode it out.')}
      <p>That craving rose, peaked, and passed — and you didn't have to fight it alone. That's ${n} rode out so far.</p>
      ${Button('Done', { go: 'recover' })}`, { cls: 'text-center' });
  }
  const who = esc(plan.name || 'them');
  const body = [
    `<p>In for 4, out for 6. Follow the circle. Cravings crest and fade — you only have to outlast the wave.</p>
     <div class="mx-auto my-6 size-36 animate-breathe rounded-full opacity-90 motion-reduce:animate-none" style="background:radial-gradient(circle,var(--primary),var(--secondary))"></div>
     <div class="text-center"><b id="breath">Breathe in</b></div>`,
    `<p>Name out loud, or in your head:</p>${Note('5 things you can <b>see</b><br>4 things you can <b>touch</b><br>3 things you can <b>hear</b><br>2 things you can <b>smell</b><br>1 thing you can <b>taste</b>')}`,
    `<p>Tap the glowing dot as many times as you can. Your brain can't fully chase a craving and a game at once.</p>
     <div id="arena" class="relative h-56 touch-manipulation overflow-hidden rounded-2xl border-2 border-border bg-background">
       <button class="absolute size-14 rounded-full bg-warning shadow-[0_0_0_6px_var(--warning-soft)]" style="left:40%;top:40%" data-act="dot" aria-label="Tap"></button></div>
     <p class="text-center"><b id="score">${r.score}</b> <span class="text-muted-foreground">taps</span></p>`,
    plan.why ? `<p>You wrote this for yourself:</p>${Note(`<span class="text-xl">“${esc(plan.why)}”</span>`)}`
      : `<p>You haven't written your “why” yet. Take a second to think: who or what are you doing this for?</p>${Button('Write it in My progress', { go: 'recover:tracker', variant: 'outline' })}`,
    plan.phone ? `<p>Send ${esc(plan.name || 'your person')} a message. You don't need to explain.</p>
      ${Button(`💬 Text ${who}`, { href: `sms:${esc(plan.phone)}?&body=${encodeURIComponent("Hey, I'm having a rough moment. Can you talk?")}` })}${Button('📞 Call', { href: `tel:${esc(plan.phone)}`, variant: 'outline' })}`
      : `<p>Nobody saved yet. You can still reach a real person right now.</p>${Button('Open hotlines', { go: 'help' })}${Button('Save a trusted contact', { go: 'recover:tracker', variant: 'outline' })}`
  ][r.step];
  return `${BackLink('recover', '← Leave')}<div class="text-center"><div id="clock" class="text-4xl font-extrabold tabular-nums">10:00</div><div class="text-xs text-muted-foreground">Urges tend to fade within minutes. You only have to get through this one.</div></div>
    <div class="mt-3.5">${Steps(5, r.step)}</div>
    ${Card(`${Badge(`Step ${r.step + 1} of 5`)}${H2(RESCUE_STEPS[r.step], 'mt-2')}${body}
    ${Button(r.step === 4 ? "I'm through it" : 'Next step →', { act: 'r-next', variant: r.step === 4 ? 'default' : 'outline' })}`, { fx: true })}`;
}

const MILES = [[1, '1 day'], [3, '3 days'], [7, '1 week'], [14, '2 weeks'], [30, '1 month'], [60, '2 months'], [90, '3 months'], [180, '6 months'], [365, '1 year']];
const BUYS = [[1000, 'a real vacation ✈️'], [400, 'a new phone 📱'], [150, 'a weekend trip 🏕️'], [60, 'new sneakers 👟'], [30, 'a concert ticket 🎟️'], [10, 'a nice lunch 🍜'], [0, 'a good coffee ☕']];
const daysSince = iso => Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 864e5));

function vTracker() {
  const t = store.get('tracker'), plan = store.get('plan', {});
  const today = new Date().toISOString().slice(0, 10);
  const planCard = Card(`${H2('My support plan', 'mt-0')}${Muted('Used by the craving rescue button. Stored only on this device.', 'text-sm')}
    ${Textarea('why', "Why I'm doing this", esc(plan.why), 'rows="2" placeholder="e.g. So I can play in the final this year"')}
    ${Input('cname', 'Trusted person', `placeholder="Name" value="${esc(plan.name)}"`)}
    ${Input('cphone', 'Their phone number', `type="tel" placeholder="Phone" value="${esc(plan.phone)}"`)}
    ${Button('Save plan', { act: 'save-plan' })}`);
  if (!t) {
    return `${BackLink('recover', '← Back')}${H1('Start your streak')}${Card(
      `${Input('thing', 'What are you quitting? (optional)', 'placeholder="e.g. vaping"')}
      ${Input('perday', 'About how much did it cost per day? ($)', 'type="number" min="0" step="0.5" value="8"')}
      ${Input('start', 'Quit date', `type="date" max="${today}" value="${today}"`)}
      ${Button('Start tracking', { act: 'save-tracker' })}`)}${planCard}
      ${Note('Quitting some substances (alcohol, benzodiazepines) suddenly can be medically dangerous. If you\'ve used heavily, talk to a doctor before stopping.', 'text-sm')}`;
  }
  const d = daysSince(t.start), money = Math.round(d * t.perDay), buy = BUYS.find(([min]) => money >= min)[1];
  const next = MILES.find(([n]) => n > d);
  const stat = (val, label, prefix = '') => `<div class="rounded-2xl bg-secondary p-3.5 text-center"><b class="block text-3xl font-extrabold leading-tight tabular-nums" data-count="${val}" data-prefix="${prefix}">${prefix}${val}</b><span class="text-sm text-muted-foreground">${label}</span></div>`;
  return `${BackLink('recover', '← Back')}${H1(d === 0 ? 'Day one. You showed up.' : `${d} day${d === 1 ? '' : 's'}${t.thing ? ` without ${esc(t.thing)}` : ''}`)}
    <div class="grid grid-cols-2 gap-2.5">${stat(d, 'days')}${stat(money, 'not spent', '$')}${stat(store.get('rescues', 0), 'cravings rode out')}${stat(Math.max(t.best || 0, d), 'best streak (days)')}</div>
    ${Card(`<b>That's about ${buy}.</b>${Muted(next ? `Next milestone: ${next[1]}, ${next[0] - d} day${next[0] - d === 1 ? '' : 's'} to go.` : "You've passed every milestone here. Incredible.", 'text-sm')}
      <div class="flex flex-wrap gap-2">${MILES.map(([n, l]) => d >= n
        ? `<div class="mile-got rounded-xl border-2 border-primary bg-secondary px-3 py-2 text-sm font-semibold">✓ ${l}</div>`
        : `<div class="rounded-xl border-2 border-dashed border-border px-3 py-2 text-sm text-muted-foreground">${l}</div>`).join('')}</div>`)}
    ${planCard}
    ${Card(`<b>Had a slip?</b>${Muted("It happens to many people in recovery, and it doesn't erase your progress. Your best streak is kept.")}
      ${Button('Start a fresh streak', { act: 'slip', variant: 'outline' })}`)}`;
}

function vHelp() {
  return `${H1('Get help now')}${Muted('Free, confidential, and no judgment. (Numbers shown are for the US; swap in your local ones.)')}
  ${Card(HOTLINES.map(([n, d, href, label]) => `<div class="flex items-center justify-between gap-3 border-b border-border py-3 last:border-0"><div><b>${n}</b><br><span class="text-sm text-muted-foreground">${d}</span></div><a class="whitespace-nowrap font-bold text-primary no-underline" href="${href}">${label}</a></div>`).join(''), { cls: 'py-2' })}
  ${Card(`${H2("I'm not ready to quit — I just want to talk", 'mt-0')}
    <p>That's okay. You don't have to be ready to call. The SAMHSA helpline will talk through options with no pressure.</p>
    ${Note("<b>Safer-use basics, if you're using right now:</b><br>• Don't use alone. Tell someone or use with a person who can call for help.<br>• Assume any pill not from a pharmacy could contain fentanyl.<br>• If you use opioids, carry naloxone (Narcan). Many pharmacies offer it without a prescription.<br>• Don't mix substances, especially with alcohol or sedatives.")}
    ${Button('Call SAMHSA: 1-800-662-4357', { href: 'tel:18006624357' })}`)}
  ${Card(`${H2('Worried about someone else?', 'mt-0')}<p>Stay calm, pick a private moment, and lead with care: “I've noticed you seem off lately, and I care about you.” Ask questions before giving advice, and offer to help them find support.</p>`)}`;
}

/* ---------- live updates (no re-render, so games keep state) ---------- */
function tick() {
  const r = S.rescue; if (!r) return;
  const el = Math.floor((Date.now() - r.t0) / 1000), rem = Math.max(0, 600 - el);
  const c = $('#clock'); if (c) c.textContent = `${String(Math.floor(rem / 60)).padStart(2, '0')}:${String(rem % 60).padStart(2, '0')}`;
  const b = $('#breath'); if (b) b.textContent = (el % 10) < 4 ? 'Breathe in…' : 'Breathe out slowly…';
}

/* ---------- actions ---------- */
const ACTIONS = {
  'story-go': to => { S.story.node = to; render(); window.scrollTo(0, 0); },
  'story-restart': () => go('prevent', 'story'),
  'p-scene': k => { S.practice = { scene: k, round: 0, stars: 0, fb: null }; render(true); },
  'p-sample': s => { $('#reply').value = s; $('#reply').focus(); },
  'p-send': () => { const text = $('#reply').value; if (!text.trim()) return $('#reply').focus(); const res = coach(text); S.practice.fb = { ...res, text }; S.practice.stars += res.stars; render(); },
  'p-next': () => { S.practice.round++; S.practice.fb = null; render(); },
  'f-ans': v => { const f = S.facts; f.ans = v === '1'; if (f.ans === FACTS[f.i].a) f.score++; render(); },
  'f-next': () => { S.facts.i++; S.facts.ans = null; render(); },
  'r-next': () => {
    const r = S.rescue;
    if (r.step < 4) { r.step++; return render(); }
    store.set('rescues', store.get('rescues', 0) + 1); r.done = true; render(true);
  },
  'dot': (_, el) => {
    S.rescue.score++; $('#score').textContent = S.rescue.score;
    el.style.left = (Math.random() * 78 + 2) + '%'; el.style.top = (Math.random() * 70 + 2) + '%';
    run(m => m.animate(el, { scale: [.5, 1] }, { duration: .25, ease: 'easeOut' }));
  },
  'save-tracker': () => {
    store.set('tracker', { thing: $('#thing').value.trim(), perDay: Math.max(0, parseFloat($('#perday').value) || 0), start: ($('#start').value || new Date().toISOString().slice(0, 10)) + 'T00:00:00', best: 0 });
    savePlan(); render(true);
  },
  'save-plan': (_, el) => { savePlan(); el.textContent = 'Saved ✓'; },
  'slip': () => {
    if (!confirm('Start a fresh streak? Your best streak will be kept.')) return;
    const t = store.get('tracker'); t.best = Math.max(t.best || 0, daysSince(t.start)); t.start = new Date().toISOString(); store.set('tracker', t); render(true);
  }
};
function savePlan() {
  const g = id => ($(id) ? $(id).value.trim() : '');
  store.set('plan', { why: g('#why'), name: g('#cname'), phone: g('#cphone') });
}

render(true);
</script>
</body>
</html>
